# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# -- JVM & Memory --
# Gradle daemon: 4GB heap, optimize GC
org.gradle.jvmargs=-Xmx4096m -XX:+UseZGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compiler daemon: separate process, 2GB heap
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseZGC

# -- Parallelism & Caching --
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
# Max parallel workers (default = CPU cores)
# org.gradle.workers.max=8

# -- Kotlin --
kotlin.code.style=official
kotlin.incremental=true
kotlin.build.report.output=file

# -- KSP --
# appfunctions-compiler:1.0.0-alpha08 的聚合处理器(AppFunctionAggregateProcessor)在
# Kotlin 2.3.21 / KSP 2.3.9 下的 KSP 自身增量引擎(注意: 是 ksp.incremental,非上面的
# kotlin.incremental)里必现 KaInvalidLifetimeOwnerAccessException(Kotlin Analysis API
# 的 PSI 生命周期在增量重放时失效)。已验证升级路径不通:appfunctions-service 目前
# 最高只发到 1.0.0-alpha09(alpha10 尚未发布该 artifact),而 alpha09 三件套(core/
# service/compiler 版本对齐)复现同一崩溃;交叉搭配 alpha10 compiler + alpha09
# core/service 虽不崩但会静默生成空的 app_functions.xml(比崩溃更危险,CI 不会报错但
# 产物是坏的)。故关闭 KSP 自身增量、换全量 KSP 规避此 bug；不影响 kotlin.incremental。
# 代价:本模块自带的 :ksp-processor(PrefSchemaProcessor)也随之失去增量,每次构建全量
# 重跑 KSP，日常增量编译会变慢。androidx.appfunctions 出新版本后应重新验证能否去掉本行。
ksp.incremental=false

# -- Android --
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.overridePathCheck=true
